# ffh2-rs in the browser (docs/WEB.md): builds the static site (the client with
# the game engine compiled to WebAssembly), smoke-tests it in headless Chromium and, once the
# workspace's own gate passes too (`test`: cargo build and test, `ffh data` with 0 warnings, the
# client's checks), deploys it to GitHub Pages (https://misterflask.github.io/RustFallFromHeaven/) on every push to master
# (except pushes touching only anim-sprint/). One-time setup by the repository owner: Settings -> Pages ->
# Build and deployment -> Source: GitHub Actions.
#
# Run by hand (Actions -> ffh2-rs web -> Run workflow) on any branch to build and test the site;
# only master deploys.
#
# The deployed site also holds the classic rules below classic/ (docs/WEB.md, "The classic site"):
# the tag $CLASSIC_REF, the game before the sweeping rules changes, built by the `classic` job with
# its own saves database. The `pages` job puts the two together.

name: ffh2-rs web

on:
  push:
    branches: [master]
    paths-ignore:
      - "anim-sprint/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The frozen classic rules deployed below classic/ (a tag; a branch would work too, for fixes
  # backported to the classic game).
  CLASSIC_REF: classic-1

jobs:
  # The commit gate (CLAUDE.md): `cargo build --release && cargo test --release`, the data loading
  # with 0 warnings and tools/web-check.sh. In parallel with the site build; deploy needs both.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and test the workspace
        run: cargo build --release && cargo test --release

      - name: Load the data (0 warnings)
        run: |
          out="$(cargo run --release -q -p ffh-cli -- data)"
          echo "$out"
          if ! echo "$out" | head -n 1 | grep -q '; 0 warnings$'; then
            echo "::error::ffh data reports warnings"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # GitHub sets CI, so a missing node fails here instead of being skipped.
      - name: Check the browser client (tools/web-check.sh)
        run: bash tools/web-check.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      # No cargo cache: the project has no external crates (docs: "No external crates"), and
      # cargo decides whether a workspace crate is fresh by file times, which a fresh checkout
      # always makes newer than a cached target/, so a restored target/ would be rebuilt anyway.

      - name: Build the site
        env:
          # The native ffh-play only exports files here: no debug info (the engine never has any).
          CARGO_PROFILE_RELEASE_DEBUG: "0"
        run: tools/web-site.sh _site

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The playwright package in a directory of its own (the site has no npm dependencies),
      # and the Chromium build that version drives.
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Smoke test (service worker isolation)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node tools/web-site-smoke.mjs --site _site --out "$RUNNER_TEMP/smoke/sw"

      - name: Smoke test (no isolation, the fallback)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node tools/web-site-smoke.mjs --site _site --no-sw --turns 2 --out "$RUNNER_TEMP/smoke/no-sw"

      - name: Keep the smoke tests' screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-site-smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          include-hidden-files: true
          if-no-files-found: error

  # The classic site: $CLASSIC_REF built as it is, with the toolchain of its day, its saves in a
  # database of their own (both sites share the origin, so IndexedDB) and smoke-tested below
  # classic/. The tag never changes, so the site is built once per tag commit and then restored
  # from the cache (which GitHub drops after a week unused: the next deploy then builds it again).
  classic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CLASSIC_REF }}

      - name: The classic commit
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore the classic site
        id: cache
        uses: actions/cache@v4
        with:
          path: _classic
          key: classic-site-v1-${{ steps.rev.outputs.sha }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: wasm32-wasip1

      - name: Build the classic site
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"
        run: tools/web-site.sh _classic --saves ffh-play-classic

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Smoke test (below classic/)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node tools/web-site-smoke.mjs --site _classic --base /RustFallFromHeaven/classic/ --out "$RUNNER_TEMP/smoke/classic"

      - name: Keep the smoke test's screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: classic-site-smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: classic-site
          path: _classic
          include-hidden-files: true
          if-no-files-found: error

  # The deployed site: the main site, and the classic one below classic/.
  pages:
    needs: [build, classic]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - uses: actions/download-artifact@v4
        with:
          name: classic-site
          path: _site/classic

      - name: Check the two sites and their saves databases
        run: |
          for f in index.html web/boot.js web/site.js classic/index.html classic/web/boot.js classic/web/site.js; do
            [ -f "_site/$f" ] || { echo "::error::the site has no $f"; exit 1; }
          done
          grep -qx 'export const SAVES_DB = "ffh-play";' _site/web/site.js || { echo "::error::the main site does not keep its saves in ffh-play"; exit 1; }
          grep -qx 'export const SAVES_DB = "ffh-play-classic";' _site/classic/web/site.js || { echo "::error::the classic site does not keep its saves in ffh-play-classic"; exit 1; }
          echo "main: $(cat _site/web/version.txt); classic: $(cat _site/classic/web/version.txt)"

      # Fails with a clear message until Pages is enabled with the source "GitHub Actions".
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: [pages, test]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
